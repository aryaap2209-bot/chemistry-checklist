<title>🧪 A* AQA Chemistry Master Checklist</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

:root{
  --pink:#f7d6e3;
  --pink-dark:#b66d8b;
  --lavender:#ddd8f3;
  --mint:#dcefe5;
  --cream:#fffaf7;
  --peach:#f8e2d2;
  --text:#514852;
  --muted:#8d818b;
  --white:#ffffff;
  --border:#eadde4;
  --shadow:0 8px 25px rgba(120,90,110,.09);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(135deg,#fff8fb,#f8f5ff,#f5fbf8);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
}

.container{
  max-width:1050px;
  margin:auto;
  padding:25px 18px 60px;
}

.hero{
  text-align:center;
  background:rgba(255,255,255,.78);
  border:1px solid var(--border);
  border-radius:30px;
  padding:35px 20px 30px;
  box-shadow:var(--shadow);
}

.hero h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(28px,5vw,48px);
  margin:0;
  color:#674f60;
}

.hero p{
  color:var(--muted);
  margin:10px auto 0;
  max-width:700px;
}

.badges{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}

.badge{
  padding:7px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.badge.pink{background:var(--pink)}
.badge.lav{background:var(--lavender)}
.badge.mint{background:var(--mint)}
.badge.peach{background:var(--peach)}

.progress-card{
  margin-top:20px;
  background:white;
  border:1px solid var(--border);
  border-radius:22px;
  padding:20px;
  box-shadow:var(--shadow);
}

.progress-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:700;
}

.progress-bar{
  height:15px;
  background:#f0e8ed;
  border-radius:999px;
  overflow:hidden;
  margin-top:12px;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#e9b8ca,#c9bee9,#b9dfca);
  border-radius:999px;
  transition:.3s;
}

.controls{
  display:flex;
  gap:10px;
  margin:20px 0;
  flex-wrap:wrap;
}

input[type="search"]{
  flex:1;
  min-width:220px;
  padding:13px 16px;
  border:1px solid var(--border);
  border-radius:15px;
  font:inherit;
  background:white;
  color:var(--text);
}

button{
  border:0;
  border-radius:15px;
  padding:12px 16px;
  font:inherit;
  font-weight:600;
  cursor:pointer;
  background:var(--pink);
  color:#694f60;
}

button:hover{
  transform:translateY(-1px);
}

.section{
  margin-top:22px;
}

.section-header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  text-align:left;
  padding:19px 20px;
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  cursor:pointer;
}

.section-title{
  font-family:'Playfair Display',serif;
  font-size:20px;
  color:#664f60;
}

.section-count{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.chevron{
  font-size:18px;
  transition:.2s;
}

.section.open .chevron{
  transform:rotate(180deg);
}

.section-content{
  display:none;
  padding:10px 0 0;
}

.section.open .section-content{
  display:block;
}

.topic{
  background:rgba(255,255,255,.82);
  border:1px solid var(--border);
  border-radius:18px;
  margin:10px 0;
  overflow:hidden;
}

.topic-header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  text-align:left;
  background:white;
  border-radius:0;
  padding:15px 17px;
}

.topic-name{
  font-weight:700;
}

.topic-progress{
  font-size:11px;
  color:var(--muted);
}

.items{
  padding:4px 17px 15px;
}

.item{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:7px 0;
  border-bottom:1px dashed #eee4e9;
  font-size:14px;
  line-height:1.45;
}

.item:last-child{
  border-bottom:0;
}

.item input{
  margin-top:4px;
  accent-color:#c7839f;
  width:17px;
  height:17px;
  flex-shrink:0;
}

.item.done label{
  text-decoration:line-through;
  color:#aaa;
}

.footer{
  text-align:center;
  margin-top:35px;
  color:var(--muted);
  font-size:12px;
}

.hidden{
  display:none!important;
}

@media(max-width:650px){
  .container{padding:12px 10px 40px}
  .hero{padding:28px 15px}
  .section-title{font-size:17px}
  .item{font-size:13px}
}
</style>
</head>

</div>

const checklist=document.getElementById("checklist");
let allItems=[];

function render(){
  checklist.innerHTML="";
  allItems=[];

  sections.forEach((section,sIndex)=>{
    const sec=document.createElement("div");
    sec.className="section";

    const header=document.createElement("button");
    header.className="section-header";

    const left=document.createElement("div");
    left.innerHTML=`
      <div class="section-title">${section.title}</div>
      <div class="section-count" id="section-count-${sIndex}"></div>
    `;

    const chev=document.createElement("span");
    chev.className="chevron";
    chev.textContent="⌄";

    header.appendChild(left);
    header.appendChild(chev);

    const content=document.createElement("div");
    content.className="section-content";

    section.topics.forEach((topic,tIndex)=>{
      const topicBox=document.createElement("div");
      topicBox.className="topic";

      const topicHeader=document.createElement("button");
      topicHeader.className="topic-header";

      const topicName=document.createElement("span");
      topicName.className="topic-name";
      topicName.textContent=topic.name;

      const topicProgress=document.createElement("span");
      topicProgress.className="topic-progress";
      topicProgress.id=`topic-progress-${sIndex}-${tIndex}`;

      topicHeader.appendChild(topicName);
      topicHeader.appendChild(topicProgress);

      const items=document.createElement("div");
      items.className="items";

      topic.items.forEach((text,i)=>{
        const id=`s${sIndex}-t${tIndex}-i${i}`;

        const row=document.createElement("div");
        row.className="item";

        const cb=document.createElement("input");
        cb.type="checkbox";
        cb.id=id;
        cb.dataset.id=id;

        const saved=localStorage.getItem(id);
        if(saved==="true") cb.checked=true;

        const label=document.createElement("label");
        label.htmlFor=id;
        label.textContent=text;

        if(cb.checked) row.classList.add("done");

        cb.addEventListener("change",()=>{
          localStorage.setItem(id,cb.checked);
          row.classList.toggle("done",cb.checked);
          updateProgress();
        });

        row.appendChild(cb);
        row.appendChild(label);
        items.appendChild(row);

        allItems.push({
          checkbox:cb,
          section:sIndex,
          topic:tIndex,
          row:row
        });
      });

      topicHeader.addEventListener("click",()=>{
        items.classList.toggle("hidden");
      });

      topicBox.appendChild(topicHeader);
      topicBox.appendChild(items);
      content.appendChild(topicBox);
    });

    header.addEventListener("click",()=>{
      sec.classList.toggle("open");
    });

    sec.appendChild(header);
    sec.appendChild(content);
    checklist.appendChild(sec);
  });

  updateProgress();
}

function updateProgress(){
  const total=allItems.length;
  const done=allItems.filter(x=>x.checkbox.checked).length;
  const pct=total ? Math.round(done/total*100) : 0;

  document.getElementById("percentage").textContent=pct+"%";
  document.getElementById("counter").textContent=`${done} / ${total} completed`;
  document.getElementById("progressFill").style.width=pct+"%";

  sections.forEach((section,s)=>{
    let sectionItems=allItems.filter(x=>x.section===s);
    let completed=sectionItems.filter(x=>x.checkbox.checked).length;

    document.getElementById(`section-count-${s}`).textContent=
      `${completed} / ${sectionItems.length} completed`;

    section.topics.forEach((topic,t)=>{
      let topicItems=allItems.filter(x=>x.section===s && x.topic===t);
      let topicDone=topicItems.filter(x=>x.checkbox.checked).length;

      document.getElementById(`topic-progress-${s}-${t}`).textContent=
        `${topicDone}/${topicItems.length}`;
    });
  });
}

function expandAll(){
  document.querySelectorAll(".section").forEach(x=>x.classList.add("open"));
}

function collapseAll(){
  document.querySelectorAll(".section").forEach(x=>x.classList.remove("open"));
}

function resetProgress(){
  if(!confirm("Reset ALL checklist progress? This cannot be undone.")) return;

  allItems.forEach(x=>{
    x.checkbox.checked=false;
    x.row.classList.remove("done");
    localStorage.removeItem(x.checkbox.dataset.id);
  });

  updateProgress();
}

document.getElementById("search").addEventListener("input",function(){
  const query=this.value.toLowerCase().trim();

  document.querySelectorAll(".topic").forEach(topic=>{
    const text=topic.innerText.toLowerCase();

    if(!query){
      topic.classList.remove("hidden");
      topic.querySelector(".items").classList.remove("hidden");
      return;
    }

    if(text.includes(query)){
      topic.classList.remove("hidden");
      topic.querySelector(".items").classList.remove("hidden");
    }else{
      topic.classList.add("hidden");
    }
  });

  document.querySelectorAll(".section").forEach(section=>{
    const visible=section.querySelectorAll(".topic:not(.hidden)").length;

    if(query && visible>0){
      section.classList.add("open");
    }

    if(query && visible===0){
      section.classList.add("hidden");
    }else{
      section.classList.remove("hidden");
    }
  });
});

render();
